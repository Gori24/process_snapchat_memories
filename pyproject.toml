[project]
name = "snapmem"
dynamic = ["version"]
description = "Snapchat-Memories-Export (Zips) zu iCloud-tauglichen Fotos/Videos mit eingebrannten Overlays und korrekten Metadaten"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11",
    "imageio-ffmpeg>=0.6",
    "timezonefinder>=6",
    "tzdata",
    "PyExifTool>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
snapmem = "snapmem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "snapmem.__version__" }

[tool.setuptools.packages.find]
include = ["snapmem*"]

[tool.setuptools.package-data]
"snapmem.review" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
